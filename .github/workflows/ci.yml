name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # ubuntu-latest is 26.04, which Playwright 1.57 cannot install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PORTAL_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
        env:
          CI: true
          PORTAL_MODE: mock
          VERCEL_ENV: preview
